[build]
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# 带查询串版本号的脚本/样式：允许缓存但强制每次回源校验，
# 一旦版本号变更（?v=xx），浏览器会当成全新 URL 请求，不会用旧副本。
[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# 静态资源（assets/）有版本号兜底，命中后 1 年强缓存 + immutable 跳过二次校验
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
